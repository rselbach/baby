# Serves the Baby download page (site/) at https://rselbach.com/baby/.
# deploy-site.sh installs this as /etc/nginx/snippets/baby.conf and
# includes it in the rselbach.com server block. `^~` keeps the blog's regex
# locations (image, CSS, and JS caching) from matching anything under /baby/.

location = /baby {
    # nginx listens on 8000 behind the exe.dev proxy; keep the redirect relative
    absolute_redirect off;
    return 301 /baby/;
}

location ^~ /baby/ {
    root /var/www/baby-site/current;
    index index.html;

    # self, Google Fonts, and the release feed the download button reads
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://rselbach.github.io; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=60, stale-if-error=86400" always;
    # add_header here disables inheritance from the parent server/http block;
    # TLS and Strict-Transport-Security are handled by the exe.dev proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    try_files $uri $uri/ =404;
}
